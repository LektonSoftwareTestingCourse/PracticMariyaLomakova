name: Practice 5 API contracts

on:
  push:
    branches: ['practice-5-*']
    paths:
      - 'services/**'
      - 'scripts/run-api-tests.sh'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'services/api-tests/**'
      - 'scripts/run-api-tests.sh'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run three complete API test suites
        env:
          API_TEST_RUNS: '3'
        run: bash scripts/run-api-tests.sh
      - name: Publish test reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-5-api-results
          path: |
            target/practice-5/logs/
            target/practice-5/run-*/
            services/api-tests/target/surefire-reports/
          if-no-files-found: error
